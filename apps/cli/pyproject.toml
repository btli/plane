[project]
name = "plane-cli"
version = "0.1.0"
description = "Plane CLI for the v1 API"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "pydantic==2.12.5",
    "rich==14.2.0",
    "typer==0.20.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.14.8",
    "ty==0.0.1a32",
    "pyinstaller==6.17.0",
]

[project.scripts]
plane = "plane.main:app"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
quote-style = "double"

[tool.ty]
python-version = "3.11"
paths = ["plane"]
